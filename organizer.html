    <main class="organizer-page">

        <div class="organizer-heading">

            <p>CREATE YOUR EVENT</p>

            <h1>Host an Event</h1>

            <span>
                Tell us about your event and let people discover it
                on Kelvin Event Hub.
            </span>

        </div>
<form class="event-form">

    <label for="organizer-name">
        Organizer Name
    </label>

    <input
        type="text"
        id="organizer-name"
        placeholder="Enter your name or organization"
        required
    >


    <label for="organizer-email">
        Organizer Email
    </label>

    <input
        type="email"
        id="organizer-email"
        placeholder="Enter your email"
        required
    >


    <label for="organizer-phone">
        Organizer Phone
    </label>

    <input
        type="tel"
        id="organizer-phone"
        placeholder="08012345678"
        required
    >


    <label for="event-name">
        Event Name
    </label>

    <input
        type="text"
        id="event-name"
        placeholder="Enter event name"
        required
    >


    <label for="event-description">
        Event Description
    </label>

    <textarea
        id="event-description"
        placeholder="Tell people about your event"
        required
    ></textarea>


    <label for="event-date">
        Event Date
    </label>

    <input
        type="date"
        id="event-date"
        required
    >


    <label for="event-time">
        Event Time
    </label>

    <input
        type="time"
        id="event-time"
        required
    >


    <label for="event-location">
        Event Location
    </label>

    <input
        type="text"
        id="event-location"
        placeholder="Enter event location"
        required
    >


    <label for="ticket-price">
        Ticket Price
    </label>

    <input
        type="number"
        id="ticket-price"
        placeholder="Enter ticket price"
        min="0"
        required
    >


    <label for="ticket-quantity">
        Number of Tickets Available
    </label>

    <input
        type="number"
        id="ticket-quantity"
        placeholder="e.g. 100"
        min="1"
        required
    >


    <label for="event-image">
        Event Image
    </label>

    <input
        type="file"
        id="event-image"
        accept="image/*"
    >


    <button type="submit">
        Submit Event
    </button>

</form>l
